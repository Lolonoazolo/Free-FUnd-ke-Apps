<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>QUotes_app</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="quote-box">
      <h2>Quote of the day</h2>
      <blockquote id="quote">
        Loading....
      </blockquote>
      <span id="author">Loading...</span>
      <div><button onclick="getquote(api_url)">Next Quote
        </button>
        <button onclick="Tweet()"> <img src="twitter.png" alt="">Tweet</button>
      </div>
    </div>
  </main>
  <script>
    const quote = document.getElementById("quote")
    const author = document.getElementById("author")
    const api_url = "https://api.quotable.io/random";

    async function getquote(url) {
      const response = await fetch(url);
      var data = await response.json();
      console.log(data);
      quote.innerHTML = data.content;
      author.innerHTML = data.author;

    }
    getquote(api_url);
    function Tweet() {
      window.open("https://x.com/share?ref_src=twsrc%5Etfw" + quote.innerHTML + "-----by" + author.innerHTML, "Tweet Window", "width=600 , height=300")

    }


  </script>
</body>

</html>
